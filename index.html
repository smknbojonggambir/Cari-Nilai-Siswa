<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?= include('Stylesheet'); ?> 
  <title>Cari Nilai</title>
</head>
<body>
  <div class="container">
    <h2 class="mt-3 mb-4 text-center">Cari Nilai Siswa</h2>
    <div class="form-group">
      <label for="studentName">Nama Siswa:</label>
      <input type="text" id="studentName" class="form-control" placeholder="Contoh: Siti Fitriyani">
    </div>
    
    <button class="btn btn-primary btn-block" onclick="searchData()">Cari</button>
    
    <div id="output" class="mt-4">Hasil akan muncul di sini...</div>
  </div>

  <script>
    function searchData() {
      var name = document.getElementById('studentName').value.trim(); 
      
      // Menggunakan kelas alert-info Bootstrap untuk pesan loading
      document.getElementById('output').innerHTML = '<div class="alert alert-info">⏳ Mencari data...</div>';
      
      google.script.run
          .withSuccessHandler(displayResult)
          .searchNilai(name); 
    }

    function displayResult(result) {
      document.getElementById('output').innerHTML = result;
    }
  </script>
</body>
</html>
